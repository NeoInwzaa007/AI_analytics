version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_dashboard_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
environment:
  - NODE_FUNCTION_ALLOW_EXTERNAL=pg,mysql2
